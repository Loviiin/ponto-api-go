basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        example: superadmin@ponto.com
        type: string
      password:
        example: superadmin
        type: string
    required:
    - email
    - password
    type: object
  auth.SignUpRequest:
    properties:
      empresa:
        properties:
          cnpj:
            example: "12345678000195"
            type: string
          nome_fantasia:
            example: Minha Empresa
            type: string
          razao_social:
            example: Minha Empresa LTDA
            type: string
        required:
        - cnpj
        - nome_fantasia
        - razao_social
        type: object
      localidade:
        properties:
          cep:
            example: 01001-000
            type: string
          nome:
            example: Matriz Principal
            type: string
          raio_geofence_metros:
            example: 100
            type: number
        required:
        - cep
        - nome
        - raio_geofence_metros
        type: object
      usuario:
        properties:
          cpf:
            example: "12345678900"
            type: string
          data_admissao:
            example: "2025-01-20T00:00:00Z"
            type: string
          email:
            example: joao@empresa.com
            type: string
          nome:
            example: João Administrador
            type: string
          password:
            example: senha123
            minLength: 6
            type: string
          salario:
            example: 5000
            type: number
        required:
        - cpf
        - data_admissao
        - email
        - nome
        - password
        - salario
        type: object
    type: object
  cargo.createRequest:
    properties:
      empresa_id:
        type: integer
      nome:
        type: string
    required:
    - empresa_id
    - nome
    type: object
  empresa.criaEmpresaRequest:
    properties:
      cnpj:
        example: 12.345.678/0001-95
        type: string
      nomeFantasia:
        example: Minha Empresa
        type: string
      razaoSocial:
        example: Minha Empresa LTDA
        type: string
    required:
    - cnpj
    - nomeFantasia
    - razaoSocial
    type: object
  justificativa.aprovarReprovarRequest:
    properties:
      aprovado:
        type: boolean
      motivo_reprovacao:
        type: string
    type: object
  justificativa.solicitarAjusteRequest:
    properties:
      data_ocorrencia:
        example: "2025-09-10T09:00:00Z"
        type: string
      descricao:
        example: Esqueci de bater o ponto na entrada.
        type: string
      tipo:
        example: ENTRADA_ESQUECIDA
        type: string
    required:
    - data_ocorrencia
    - descricao
    - tipo
    type: object
  localidade.createRequest:
    properties:
      cep:
        type: string
      empresa_id:
        type: integer
      nome:
        type: string
      raio_geofence_metros:
        type: number
    required:
    - cep
    - empresa_id
    - nome
    - raio_geofence_metros
    type: object
  model.Cargo:
    properties:
      carga_horaria_diaria_minutos:
        type: integer
      empresa_id:
        type: integer
      entrada_esperada_minutos:
        type: integer
      id:
        type: integer
      minutos_almoco_esperado:
        type: integer
      nome:
        type: string
      permissoes:
        items:
          $ref: '#/definitions/model.Permissao'
        type: array
      saida_esperada_minutos:
        type: integer
      salario_maximo:
        type: number
      salario_minimo:
        type: number
    type: object
  model.Contrato:
    properties:
      cargo:
        $ref: '#/definitions/model.Cargo'
      cargo_id:
        type: integer
      data_admissao:
        type: string
      data_demissao:
        type: string
      empresa:
        $ref: '#/definitions/model.Empresa'
      empresa_id:
        type: integer
      id:
        type: integer
      localidade:
        $ref: '#/definitions/model.Localidade'
      localidade_id:
        type: integer
      salario:
        type: number
      saldo_banco_horas_minutos:
        type: integer
      usuario_id:
        type: integer
    type: object
  model.Empresa:
    properties:
      cnpj:
        type: string
      id:
        type: integer
      localidades:
        items:
          $ref: '#/definitions/model.Localidade'
        type: array
      nome_fantasia:
        type: string
      razao_social:
        type: string
    type: object
  model.Justificativa:
    properties:
      aprovador_id:
        type: integer
      data_ocorrencia:
        type: string
      descricao:
        type: string
      empresa_id:
        type: integer
      id:
        type: integer
      observacao_aprovador:
        description: Para feedback ou motivo da reprovação
        type: string
      status:
        type: string
      tipo:
        type: string
      usuario_id:
        type: integer
    type: object
  model.Localidade:
    properties:
      bairro:
        type: string
      cep:
        type: string
      cidade:
        type: string
      empresa_id:
        type: integer
      estado:
        type: string
      id:
        type: integer
      latitude:
        type: number
      logradouro:
        type: string
      longitude:
        type: number
      nome:
        description: 'Ex: "Matriz São Paulo", "Filial Rio"'
        type: string
      numero:
        type: string
      raio_geofence_metros:
        type: number
    type: object
  model.Permissao:
    properties:
      descricao:
        type: string
      id:
        type: integer
      nome:
        type: string
    type: object
  model.RegistroPonto:
    properties:
      data_criacao:
        type: string
      empresa_id:
        type: integer
      id:
        type: integer
      justificativa:
        allOf:
        - $ref: '#/definitions/model.Justificativa'
        description: Opcional, para carregar os dados se necessário
      justificativa_id:
        type: integer
      latitude:
        type: number
      localizacao:
        type: string
      longitude:
        type: number
      metodo:
        type: string
      timestamp:
        type: string
      usuario_id:
        type: integer
    type: object
  model.Usuario:
    properties:
      contrato:
        $ref: '#/definitions/model.Contrato'
      cpf:
        type: string
      data_atualizacao:
        type: string
      data_criacao:
        type: string
      email:
        type: string
      id:
        type: integer
      nome:
        type: string
    type: object
  ponto.AjustePontoRequest:
    properties:
      justificativa:
        example: Ajuste manual de entrada.
        type: string
      timestamp:
        example: "2025-09-10T09:00:00Z"
        type: string
      usuario_id:
        example: 2
        type: integer
    required:
    - justificativa
    - timestamp
    - usuario_id
    type: object
  ponto.BaterPontoRequest:
    properties:
      latitude:
        example: -15.799879
        type: number
      longitude:
        example: -47.864162
        type: number
    type: object
  ponto.EditarPontoRequest:
    properties:
      justificativa:
        example: Correção do horário de saída.
        type: string
      timestamp:
        example: "2025-09-10T18:05:00Z"
        type: string
    required:
    - justificativa
    - timestamp
    type: object
  usuario.CriarUsuarioRequest:
    properties:
      cargo_id:
        type: integer
      cpf:
        type: string
      data_admissao:
        type: string
      email:
        type: string
      empresa_id:
        description: Dados do Contrato
        type: integer
      localidade_id:
        type: integer
      nome:
        description: Dados do Usuário (Pessoa)
        type: string
      salario:
        type: number
      senha:
        minLength: 6
        type: string
    required:
    - cargo_id
    - cpf
    - data_admissao
    - email
    - empresa_id
    - localidade_id
    - nome
    - salario
    - senha
    type: object
  usuario.UpdateUsuarioRequest:
    properties:
      email:
        example: joao.dasilva@empresa.com
        type: string
      nome:
        example: João da Silva
        type: string
      senha:
        example: novaSenha456
        type: string
    type: object
host: localhost:8083
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API de alta performance para um sistema de Ponto Eletrônico.
  license:
    name: MIT
    url: https://github.com/Loviiin/ponto-api-go/blob/main/LICENSE
  termsOfService: http://swagger.io/terms/
  title: Ponto API em Go
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário com email e senha e retorna um token JWT.
      parameters:
      - description: Credenciais de Login
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Realiza o login do usuário
      tags:
      - Autenticação
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Cria uma nova empresa, a sua localidade principal (matriz), e o
        primeiro usuário administrador em uma única transação. Retorna o novo usuário
        e um token JWT.
      parameters:
      - description: Dados completos da Empresa, Localidade e Administrador
        in: body
        name: signUpRequest
        required: true
        schema:
          $ref: '#/definitions/auth.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Realiza o cadastro de uma nova empresa e seu administrador
      tags:
      - Autenticação
  /bancohoras/fechamento/usuario/{id}:
    post:
      description: Calcula o saldo de horas de um dia para um usuário e o adiciona
        ao saldo total do banco de horas. Requer permissão 'EDITAR_SALDO_FUNCIONARIOS'.
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: integer
      - description: 'Dia para fechar (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
        in: query
        name: dia
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Contrato'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Realiza o fechamento manual de um dia
      tags:
      - Banco de Horas
  /bancohoras/saldo/usuario/{id}:
    get:
      description: Retorna o saldo de horas (positivo ou negativo) de um usuário para
        um dia específico. Requer permissão 'VER_SALDO_FUNCIONARIOS' se o ID consultado
        não for o do próprio usuário.
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: integer
      - description: 'Dia para consulta (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
        in: query
        name: dia
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Consulta saldo de horas do dia
      tags:
      - Banco de Horas
  /cargos:
    get:
      description: Retorna uma lista de todos os cargos da empresa do usuário logado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Cargo'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista os cargos da empresa
      tags:
      - Cargos
    post:
      consumes:
      - application/json
      description: Cria um novo cargo para a empresa do usuário logado. Requer permissão
        'GERENCIAR_CARGOS'.
      parameters:
      - description: Dados do novo cargo
        in: body
        name: cargo
        required: true
        schema:
          $ref: '#/definitions/cargo.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Cargo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria um novo cargo
      tags:
      - Cargos
  /cargos/{id}:
    delete:
      description: Deleta um cargo da empresa. Requer permissão 'GERENCIAR_CARGOS'.
      parameters:
      - description: ID do Cargo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta um cargo
      tags:
      - Cargos
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um cargo. Requer permissão 'GERENCIAR_CARGOS'.
      parameters:
      - description: ID do Cargo
        in: path
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: dados
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza um cargo
      tags:
      - Cargos
  /cargos/{id}/permissoes/{permissaoId}:
    post:
      description: Associa uma permissão existente a um cargo. Requer permissão 'GERENCIAR_CARGOS'.
      parameters:
      - description: ID do Cargo
        in: path
        name: id
        required: true
        type: integer
      - description: ID da Permissão
        in: path
        name: permissaoId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Adiciona permissão a um cargo
      tags:
      - Cargos
  /empresas:
    get:
      description: Retorna uma lista de todas as empresas cadastradas. Requer autenticação.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Empresa'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista todas as empresas
      tags:
      - Empresas
    post:
      consumes:
      - application/json
      description: Registra uma nova empresa no sistema e configura cargos e permissões
        padrão para ela.
      parameters:
      - description: Dados da nova empresa
        in: body
        name: empresa
        required: true
        schema:
          $ref: '#/definitions/empresa.criaEmpresaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Empresa'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria uma nova empresa
      tags:
      - Empresas
  /empresas/{id}:
    delete:
      description: Deleta uma empresa permanentemente. Requer permissão 'DELETAR_EMPRESA'.
      parameters:
      - description: ID da Empresa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta uma empresa
      tags:
      - Empresas
    get:
      description: Retorna os dados de uma empresa específica pelo seu ID.
      parameters:
      - description: ID da Empresa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Empresa'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca uma empresa por ID
      tags:
      - Empresas
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma empresa. Requer permissão 'EDITAR_EMPRESA'.
      parameters:
      - description: ID da Empresa
        in: path
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: dados
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza uma empresa
      tags:
      - Empresas
  /empresas/{id}/localidades:
    get:
      description: Retorna uma lista de todas as localidades de uma empresa. Requer
        permissão 'GERENCIAR_LOCALIDADES'.
      parameters:
      - description: ID da Empresa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Localidade'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista as localidades de uma empresa
      tags:
      - Localidades
  /justificativas:
    post:
      consumes:
      - application/json
      description: Um funcionário cria uma solicitação para adicionar ou corrigir
        um registro de ponto.
      parameters:
      - description: Dados da solicitação de ajuste
        in: body
        name: solicitacao
        required: true
        schema:
          $ref: '#/definitions/justificativa.solicitarAjusteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Justificativa'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Falha interna no servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Solicita um ajuste de ponto
      tags:
      - Justificativas
  /justificativas/{id}/processar:
    post:
      consumes:
      - application/json
      description: Processa uma solicitação de ajuste, aprovando-a (o que cria o registro
        de ponto) ou reprovando-a. Requer permissão.
      parameters:
      - description: ID da Justificativa
        in: path
        name: id
        required: true
        type: integer
      - description: Ação de Aprovação/Reprovação
        in: body
        name: acao
        required: true
        schema:
          $ref: '#/definitions/justificativa.aprovarReprovarRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Justificativa'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: (Admin) Aprova ou reprova uma justificativa
      tags:
      - Justificativas
  /justificativas/pendentes:
    get:
      description: Retorna uma lista de todas as solicitações de ajuste de ponto que
        estão pendentes de aprovação. Requer permissão.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Justificativa'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
