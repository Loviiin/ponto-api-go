basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        example: superadmin@ponto.com
        type: string
      password:
        example: superadmin
        type: string
    required:
    - email
    - password
    type: object
  model.RegistroPonto:
    properties:
      data_criacao:
        type: string
      empresa_id:
        type: integer
      id:
        type: integer
      latitude:
        type: number
      longitude:
        type: number
      timestamp:
        type: string
      tipo:
        type: string
      usuario_id:
        type: integer
    type: object
  model.Usuario:
    properties:
      cargo_id:
        type: integer
      data_atualizacao:
        type: string
      data_criacao:
        type: string
      email:
        type: string
      empresa_id:
        type: integer
      id:
        type: integer
      nome:
        type: string
      saldo_banco_horas_minutos:
        type: integer
    type: object
  ponto.BaterPontoRequest:
    properties:
      latitude:
        example: -15.799879
        type: number
      longitude:
        example: -47.864162
        type: number
    type: object
  usuario.CriarUsuarioRequest:
    properties:
      cargo_id:
        example: 2
        type: integer
      email:
        example: joao.silva@empresa.com
        type: string
      empresa_id:
        example: 1
        type: integer
      nome:
        example: João Silva
        type: string
      senha:
        example: senha123
        minLength: 6
        type: string
    required:
    - cargo_id
    - email
    - empresa_id
    - nome
    - senha
    type: object
  usuario.UpdateUsuarioRequest:
    properties:
      email:
        example: joao.dasilva@empresa.com
        type: string
      nome:
        example: João da Silva
        type: string
      senha:
        example: novaSenha456
        type: string
    type: object
host: localhost:8083
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API de alta performance para um sistema de Ponto Eletrônico.
  license:
    name: MIT
    url: https://github.com/Loviiin/ponto-api-go/blob/main/LICENSE
  termsOfService: http://swagger.io/terms/
  title: Ponto API em Go
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário com email e senha e retorna um token JWT.
      parameters:
      - description: Credenciais de Login
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Realiza o login do usuário
      tags:
      - Autenticação
  /pontos:
    post:
      consumes:
      - application/json
      description: Registra um evento de ponto (entrada/saída) para o usuário logado.
      parameters:
      - description: Coordenadas da Batida de Ponto
        in: body
        name: ponto
        required: true
        schema:
          $ref: '#/definitions/ponto.BaterPontoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RegistroPonto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Registra uma batida de ponto
      tags:
      - Ponto
  /pontos/meus-registros:
    get:
      description: Retorna uma lista das batidas de ponto do usuário logado para um
        dia específico. Se o dia não for fornecido, retorna os do dia atual.
      parameters:
      - description: 'Dia para consulta (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
        in: query
        name: dia
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.RegistroPonto'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista os registros de ponto do usuário
      tags:
      - Ponto
  /usuarios:
    get:
      description: Retorna uma lista de todos os usuários pertencentes à empresa do
        requisitante.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Usuario'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista todos os usuários da empresa
      tags:
      - Usuários
    post:
      consumes:
      - application/json
      description: Cria um novo usuário (funcionário) no sistema.
      parameters:
      - description: Dados do Novo Usuário
        in: body
        name: usuario
        required: true
        schema:
          $ref: '#/definitions/usuario.CriarUsuarioRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Usuario'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um novo usuário
      tags:
      - Usuários
  /usuarios/{id}:
    delete:
      description: Deleta um usuário. Requer permissão de 'DELETAR_USUARIO' ou 'DELETAR_PROPRIA_CONTA'.
      parameters:
      - description: ID do Usuário a ser deletado
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta um usuário
      tags:
      - Usuários
    get:
      description: Retorna os dados de um usuário específico da mesma empresa.
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Usuario'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Busca um usuário por ID
      tags:
      - Usuários
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um usuário. O corpo do pedido pode conter
        qualquer um dos campos definidos no modelo.
      parameters:
      - description: ID do Usuário a ser atualizado
        in: path
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: dados
        required: true
        schema:
          $ref: '#/definitions/usuario.UpdateUsuarioRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza um usuário
      tags:
      - Usuários
  /usuarios/me:
    get:
      description: Retorna as informações detalhadas do usuário que está a fazer o
        pedido.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Usuario'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtém os dados do usuário logado
      tags:
      - Usuários
securityDefinitions:
  BearerAuth:
    description: '"Digite ''Bearer'' seguido de um espaço e o seu token."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
