      description: Cria uma nova localidade (matriz ou filial) para uma empresa, buscando
        o endereço e as coordenadas a partir do CEP. Requer permissão 'GERENCIAR_LOCALIDADES'.
      parameters:
      - description: Dados da nova localidade
        in: body
