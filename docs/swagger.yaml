      consumes:
      - application/json
      description: Atualiza os dados de um usuário. O corpo do pedido pode conter
        qualquer um dos campos definidos no modelo.
      parameters:
      - description: ID do Usuário a ser atualizado
        in: path
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: dados
        required: true
        schema:
          $ref: '#/definitions/usuario.UpdateUsuarioRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza um usuário
      tags:
      - Usuários
  /usuarios/me:
    get:
      description: Retorna as informações detalhadas do usuário que está a fazer o
        pedido.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Usuario'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtém os dados do usuário logado
      tags:
      - Usuários
securityDefinitions:
  BearerAuth:
    description: '"Digite ''Bearer'' seguido de um espaço e o seu token."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
