basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        example: superadmin@ponto.com
        type: string
      password:
        example: superadmin
        type: string
    required:
    - email
    - password
    type: object
  cargo.createRequest:
    properties:
      empresa_id:
        type: integer
      nome:
        type: string
    required:
    - empresa_id
    - nome
    type: object
  empresa.criaEmpresaRequest:
    properties:
      nome:
        type: string
      raioGeofenceMetros:
        type: number
      sedeLatitude:
        type: number
      sedeLongitude:
        type: number
    required:
    - nome
    - raioGeofenceMetros
    - sedeLatitude
    - sedeLongitude
    type: object
  model.Cargo:
    properties:
      carga_horaria_diaria_minutos:
        type: integer
      empresa_id:
        type: integer
      entrada_esperada_minutos:
        type: integer
      id:
        type: integer
      minutos_almoco_esperado:
        type: integer
      nome:
        type: string
      permissoes:
        items:
          $ref: '#/definitions/model.Permissao'
        type: array
      saida_esperada_minutos:
        type: integer
    type: object
  model.Empresa:
    properties:
      id:
        type: integer
      nome:
        type: string
      raioGeofenceMetros:
        type: number
      sedeLatitude:
        type: number
      sedeLongitude:
        type: number
    type: object
  model.Justificativa:
    properties:
      aprovador_id:
        description: Quem aprovou/reprovou (pode ser nulo)
        type: integer
      data_ocorrencia:
        type: string
      descricao:
        type: string
      empresa_id:
        type: integer
      id:
        type: integer
      status:
        description: PENDENTE, APROVADO, REPROVADO
        type: string
      tipo:
        description: 'Ex: ''AJUSTE_PONTO'', ''ATESTADO_MEDICO'''
        type: string
      usuario_id:
        description: Quem está a justificar
        type: integer
    type: object
  model.Permissao:
    properties:
      descricao:
        type: string
      id:
        type: integer
      nome:
        type: string
    type: object
  model.RegistroPonto:
    properties:
      data_criacao:
        type: string
      empresa_id:
        type: integer
      id:
        type: integer
      justificativa:
        allOf:
        - $ref: '#/definitions/model.Justificativa'
        description: Opcional, para carregar os dados se necessário
      justificativa_id:
        type: integer
      latitude:
        type: number
      localizacao:
        type: string
      longitude:
        type: number
      metodo:
        type: string
      timestamp:
        type: string
      usuario_id:
        type: integer
    type: object
  model.Usuario:
    properties:
      cargo_id:
        type: integer
      data_atualizacao:
        type: string
      data_criacao:
        type: string
      email:
        type: string
      empresa_id:
        type: integer
      id:
        type: integer
      nome:
        type: string
      saldo_banco_horas_minutos:
        type: integer
    type: object
  ponto.AjustePontoRequest:
    properties:
      justificativa:
        type: string
      timestamp:
        type: string
      usuario_id:
        type: integer
    required:
    - justificativa
    - timestamp
    - usuario_id
    type: object
  ponto.BaterPontoRequest:
    properties:
      latitude:
        example: -15.799879
        type: number
      longitude:
        example: -47.864162
        type: number
    type: object
  usuario.CriarUsuarioRequest:
    properties:
      cargo_id:
        example: 2
        type: integer
      email:
        example: joao.silva@empresa.com
        type: string
      empresa_id:
        example: 1
        type: integer
      nome:
        example: João Silva
        type: string
      senha:
        example: senha123
        minLength: 6
        type: string
    required:
    - cargo_id
    - email
    - empresa_id
    - nome
    - senha
    type: object
  usuario.UpdateUsuarioRequest:
    properties:
      email:
        example: joao.dasilva@empresa.com
        type: string
      nome:
        example: João da Silva
        type: string
      senha:
        example: novaSenha456
        type: string
    type: object
host: localhost:8083
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API de alta performance para um sistema de Ponto Eletrônico.
  license:
    name: MIT
    url: https://github.com/Loviiin/ponto-api-go/blob/main/LICENSE
  termsOfService: http://swagger.io/terms/
  title: Ponto API em Go
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário com email e senha e retorna um token JWT.
      parameters:
      - description: Credenciais de Login
        in: body
        name: loginRequest
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Realiza o login do usuário
      tags:
      - Autenticação
  /bancohoras/fechamento/usuario/{id}:
    post:
      description: Calcula o saldo de horas de um dia para um usuário e o adiciona
        ao saldo total do banco de horas. Requer permissão 'EDITAR_SALDO_FUNCIONARIOS'.
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: integer
      - description: 'Dia para fechar (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
        in: query
        name: dia
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Usuario'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Realiza o fechamento manual de um dia
      tags:
      - Banco de Horas
  /bancohoras/saldo/usuario/{id}:
    get:
      description: Retorna o saldo de horas (positivo ou negativo) de um usuário para
        um dia específico. Requer permissão 'VER_SALDO_FUNCIONARIOS' se o ID consultado
        não for o do próprio usuário.
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: integer
      - description: 'Dia para consulta (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
        in: query
        name: dia
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Consulta saldo de horas do dia
      tags:
      - Banco de Horas
  /cargos:
    get:
      description: Retorna uma lista de todos os cargos da empresa do usuário logado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Cargo'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista os cargos da empresa
      tags:
      - Cargos
    post:
      consumes:
      - application/json
      description: Cria um novo cargo para a empresa do usuário logado. Requer permissão
        'GERENCIAR_CARGOS'.
      parameters:
      - description: Dados do novo cargo
        in: body
        name: cargo
        required: true
        schema:
          $ref: '#/definitions/cargo.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Cargo'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cria um novo cargo
      tags:
      - Cargos
  /cargos/{id}:
    delete:
      description: Deleta um cargo da empresa. Requer permissão 'GERENCIAR_CARGOS'.
      parameters:
      - description: ID do Cargo
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta um cargo
      tags:
      - Cargos
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um cargo. Requer permissão 'GERENCIAR_CARGOS'.
      parameters:
      - description: ID do Cargo
        in: path
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: dados
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza um cargo
      tags:
      - Cargos
  /cargos/{id}/permissoes/{permissaoId}:
    post:
      description: Associa uma permissão existente a um cargo. Requer permissão 'GERENCIAR_CARGOS'.
      parameters:
      - description: ID do Cargo
        in: path
        name: id
        required: true
        type: integer
      - description: ID da Permissão
        in: path
        name: permissaoId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Adiciona permissão a um cargo
      tags:
      - Cargos
  /empresas:
    get:
      description: Retorna uma lista de todas as empresas cadastradas. Requer autenticação.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Empresa'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista todas as empresas
      tags:
      - Empresas
    post:
      consumes:
      - application/json
      description: Registra uma nova empresa no sistema e configura cargos e permissões
        padrão para ela.
      parameters:
      - description: Dados da nova empresa
        in: body
        name: empresa
        required: true
        schema:
          $ref: '#/definitions/empresa.criaEmpresaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Empresa'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria uma nova empresa
      tags:
      - Empresas
  /empresas/{id}:
    delete:
      description: Deleta uma empresa permanentemente. Requer permissão 'DELETAR_EMPRESA'.
      parameters:
      - description: ID da Empresa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta uma empresa
      tags:
      - Empresas
    get:
      description: Retorna os dados de uma empresa específica pelo seu ID.
      parameters:
      - description: ID da Empresa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Empresa'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Busca uma empresa por ID
      tags:
      - Empresas
    put:
      consumes:
      - application/json
      description: Atualiza os dados de uma empresa. Requer permissão 'EDITAR_EMPRESA'.
      parameters:
      - description: ID da Empresa
        in: path
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
        name: dados
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualiza uma empresa
      tags:
      - Empresas
  /permissoes:
    get:
      description: (Admin) Retorna uma lista de todas as permissões disponíveis no
        sistema.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Permissao'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Lista todas as permissões
      tags:
      - Permissões
    post:
      consumes:
      - application/json
      description: (Admin) Cria uma nova permissão global no sistema.
      parameters:
      - description: Dados da nova permissão
        in: body
        name: permissao
        required: true
        schema:
          $ref: '#/definitions/model.Permissao'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Permissao'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria uma nova permissão
      tags:
      - Permissões
  /pontos:
    post:
      consumes:
      - application/json
      description: Registra um evento de ponto (entrada/saída) para o usuário logado.
      parameters:
      - description: Coordenadas da Batida de Ponto
        in: body
        name: ponto
        required: true
        schema:
          $ref: '#/definitions/ponto.BaterPontoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RegistroPonto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Registra uma batida de ponto
      tags:
      - Ponto
  /pontos/ajuste:
    post:
      consumes:
      - application/json
      description: Adiciona um novo registro de ponto para um funcionário com uma
        justificativa. Requer permissão 'AJUSTAR_PONTO_FUNCIONARIOS'.
      parameters:
      - description: Dados do ajuste de ponto
        in: body
        name: ajuste
        required: true
        schema:
          $ref: '#/definitions/ponto.AjustePontoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RegistroPonto'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: (Admin) Adiciona um registro de ponto manual
      tags:
      - Ponto
  /pontos/meus-registros:
    get:
      description: Retorna uma lista das batidas de ponto do usuário logado para um
        dia específico. Se o dia não for fornecido, retorna os do dia atual.
      parameters:
      - description: 'Dia para consulta (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
        in: query
        name: dia
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.RegistroPonto'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista os registros de ponto do usuário
      tags:
      - Ponto
  /pontos/usuario/{id}:
    get:
      description: Retorna uma lista das batidas de ponto de um usuário específico
        para um determinado dia. Requer permissão 'VISUALIZAR_PONTO_FUNCIONARIOS'.
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: integer
      - description: 'Dia para consulta (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
        in: query
        name: dia
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.RegistroPonto'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: (Admin) Lista os registros de ponto de um usuário
      tags:
      - Ponto
  /usuarios:
    get:
      description: Retorna uma lista de todos os usuários pertencentes à empresa do
        requisitante.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Usuario'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lista todos os usuários da empresa
      tags:
      - Usuários
    post:
      consumes:
      - application/json
      description: Cria um novo usuário (funcionário) no sistema.
      parameters:
      - description: Dados do Novo Usuário
        in: body
        name: usuario
        required: true
        schema:
          $ref: '#/definitions/usuario.CriarUsuarioRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Usuario'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Cria um novo usuário
      tags:
      - Usuários
  /usuarios/{id}:
    delete:
      description: Deleta um usuário. Requer permissão de 'DELETAR_USUARIO' ou 'DELETAR_PROPRIA_CONTA'.
      parameters:
      - description: ID do Usuário a ser deletado
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Deleta um usuário
      tags:
      - Usuários
    get:
      description: Retorna os dados de um usuário específico da mesma empresa.
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Usuario'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Busca um usuário por ID
      tags:
      - Usuários
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um usuário. O corpo do pedido pode conter
        qualquer um dos campos definidos no modelo.
      parameters:
      - description: ID do Usuário a ser atualizado
        in: path
        name: id
        required: true
        type: integer
      - description: Dados para atualização
        in: body
