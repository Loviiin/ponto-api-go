  /pontos/meus-registros:
    get:
      description: Retorna uma lista das batidas de ponto do usuário logado para um
        dia específico. Se o dia não for fornecido, retorna os do dia atual.
      parameters:
      - description: 'Dia para consulta (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
