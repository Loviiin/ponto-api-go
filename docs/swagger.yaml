  /pontos/usuario/{id}:
    get:
      description: Retorna uma lista das batidas de ponto de um usuário específico
        para um determinado dia. Requer permissão 'VISUALIZAR_PONTO_FUNCIONARIOS'.
      parameters:
      - description: ID do Usuário
        in: path
        name: id
        required: true
        type: integer
      - description: 'Dia para consulta (formato: AAAA-MM-DD)'
        example: '"2025-08-26"'
