version: '3.8'

networks:
  nexora-net:
    driver: bridge

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ponto_db
    networks:
      - nexora-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d ponto_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - nexora-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: ponto_db
    ports:
      - "8080:8083"
