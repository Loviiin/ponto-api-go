services:
  ponto-db:
    image: postgres:18
    container_name: banco-ponto-eletronico-dev
    environment:
      POSTGRES_USER: pontouser
      POSTGRES_PASSWORD: senha_super_secreta_123
      POSTGRES_DB: ponto_api_db
      TZ: America/Sao_Paulo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ponto-db-volume:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    restart: unless-stopped

  ponto-api:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: ponto-api-dev
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    
    ports:
      - "8083:8083"
    environment:
       - ENVIRONMENT=development
       - DB_HOST=ponto-db
    depends_on:
      - ponto-db
    user: vscode
volumes:
  ponto-db-volume:
